# RelaxRing – közzététel GitHub Pages-re minden push után.
# A sw.js-be új verziószám kerül, így a telepített appok jelzik az új verziót.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          mkdir _site
          # a setup.html csak az otthoni szerverhez kell (helyi tanúsítvány), ide nem
          cp -r index.html manifest.json sw.js fonts.css fonts *.png _site/
          sed -i "s/__VERSION__/$(date -u +%Y%m%d%H%M%S)/" _site/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
