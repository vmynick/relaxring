# RelaxRing – közzététel GitHub Pages-re minden push után.
# A sw.js-be új verziószám kerül, így a telepített appok jelzik az új verziót.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Böngészős tesztek (tests/, Playwright): ha bármelyik elbukik, nem kerül ki az új verzió
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Test
        run: npx playwright test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          mkdir _site
          # a setup.html csak az otthoni szerverhez kell (helyi tanúsítvány), ide nem
          cp -r index.html manifest.json sw.js fonts.css fonts *.png _site/
          sed -i "s/__VERSION__/$(date -u +%Y%m%d%H%M%S)/" _site/sw.js
          # a github.io-n több projekt osztozik egy domainen: az app azonosítója a saját útvonala legyen
          sed -i 's#"id": "/"#"id": "/${{ github.event.repository.name }}/"#' _site/manifest.json
          grep -q '"id": "/${{ github.event.repository.name }}/"' _site/manifest.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
