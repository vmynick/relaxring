<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Légző körök</title>
<meta name="description" content="Légzőgyakorlat: doboz, 4-7-8, nyugtató, koherens és saját ritmus.">
<meta name="theme-color" content="#E7EEEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1A17" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RelaxRing">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fonts.css">
<style>
/* Egyképernyős app: fent legfeljebb 3 ritmus, középen a lélegző körök (ezek az indító/leállító gomb), alul egy sor és a beállítások gomb.
   Minden más a felcsúszó Beállítások lapon. Betű: Apple-eszközökön SF Pro (a számokhoz SF Pro Rounded), máshol Inter; kövér. */
:root{
  --bg:#E7EEEA; --surface:#F4F8F5; --fg:#17302A; --muted:#55706A;
  --c1:#2E7D6B; --c2:#8CC7B5; --c3:#4E9C88; --line:#C4D6CE; --on-c1:#F4F8F5;
  --display:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,system-ui,sans-serif;
  /* a körök alapmérete: a színpadhoz igazodik (cq), régi böngészőn a képernyőhöz */
  --D:min(86vw,55vh,440px);
}
@supports (width:1cqw){.stage{--D:min(88cqw,90cqh,440px)}}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1A17; --surface:#16251F; --fg:#DCEBE4; --muted:#8FAAA1;
  --c1:#3FA88E; --c2:#1F5547; --c3:#5FBFA5; --line:#2A3F38; --on-c1:#0E1A17; color-scheme:dark}}
/* Színtémák (data-color a <html>-en); az alap az Erdő (zöld) fent. A sötét változatok a világosak után jönnek, így felülírják őket. */
:root[data-color="tenger"]{--bg:#E6ECF2;--surface:#F4F7FA;--fg:#15283A;--muted:#536B80;--c1:#2D6A9F;--c2:#8DB8DB;--c3:#4C88BC;--line:#C3D2E0;--on-c1:#F4F7FA}
:root[data-color="levendula"]{--bg:#ECE9F3;--surface:#F7F5FB;--fg:#2A2340;--muted:#665E80;--c1:#6A55A8;--c2:#BBAEDF;--c3:#8774C4;--line:#D4CDE6;--on-c1:#F7F5FB}
:root[data-color="naplemente"]{--bg:#F3ECE3;--surface:#FBF7F1;--fg:#3A2614;--muted:#7D654D;--c1:#A9581F;--c2:#EBC193;--c3:#D08A4F;--line:#E3D3BF;--on-c1:#FBF7F1}
:root[data-color="rozsa"]{--bg:#F3E8EB;--surface:#FBF5F6;--fg:#3A1E26;--muted:#7E5A64;--c1:#B04A66;--c2:#E7AFBE;--c3:#C96E86;--line:#E4CCD3;--on-c1:#FBF5F6}
:root[data-color="ko"]{--bg:#E9EAEA;--surface:#F6F6F6;--fg:#22262A;--muted:#62686E;--c1:#4B5560;--c2:#B6BDC4;--c3:#78828C;--line:#D0D4D8;--on-c1:#F6F6F6}
@media (prefers-color-scheme:dark){
  :root[data-color="tenger"]{--bg:#0D1620;--surface:#142231;--fg:#DAE6F1;--muted:#8BA2B8;--c1:#4A8CC7;--c2:#1C4466;--c3:#6AA6DA;--line:#26394D;--on-c1:#0D1620}
  :root[data-color="levendula"]{--bg:#15121F;--surface:#1F1A2D;--fg:#E6E0F3;--muted:#A49BBD;--c1:#8D78CC;--c2:#3C3060;--c3:#A895E0;--line:#332B48;--on-c1:#15121F}
  :root[data-color="naplemente"]{--bg:#1C140C;--surface:#271C12;--fg:#F2E5D6;--muted:#B9A086;--c1:#D9853F;--c2:#5A3A1C;--c3:#E6A066;--line:#3B2B1C;--on-c1:#1C140C}
  :root[data-color="rozsa"]{--bg:#1D1014;--surface:#29171D;--fg:#F3E1E6;--muted:#BC98A2;--c1:#D06A86;--c2:#5B2635;--c3:#E08EA4;--line:#3D2329;--on-c1:#1D1014}
  :root[data-color="ko"]{--bg:#121416;--surface:#1B1E21;--fg:#E2E5E8;--muted:#9AA1A8;--c1:#8C98A4;--c2:#3A4148;--c3:#A9B3BC;--line:#2D3237;--on-c1:#121416}
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:21px;font-weight:700;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden;user-select:none}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto}

/* ritmusválasztó: iOS-szerű szegmentált vezérlő, legfeljebb 3 gombbal */
.modes{display:flex;gap:2px;width:100%;background:color-mix(in srgb,var(--line) 60%,transparent);border-radius:16px;padding:3px;box-sizing:border-box}
.modes button{flex:1;min-width:0;border:0;background:transparent;color:var(--muted);font-size:20px;font-weight:700;line-height:1.15;letter-spacing:-.01em;padding:11px 4px;border-radius:13px;cursor:pointer;transition:background .25s,color .25s,box-shadow .25s}
.modes button small{display:block;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;margin-top:2px;opacity:.85}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){.modes button[aria-pressed="true"]{background:color-mix(in srgb,var(--fg) 16%,var(--surface))}}

/* lélegző körök; a belső kör nagyobb, hogy a kövér felirat elférjen */
.stage{flex:1;width:100%;min-height:0;display:grid;place-items:center;position:relative;container-type:size}
.ring{position:absolute;border-radius:50%;aspect-ratio:1;max-width:100%}
#r3{width:var(--D);border:2px solid var(--c3);opacity:.6}
#r2{width:calc(var(--D)*.72);background:var(--c2);opacity:.55}
#r1{width:calc(var(--D)*.5);background:var(--c1)}
#ringBtn{position:absolute;width:calc(var(--D)*.86);aspect-ratio:1;max-width:100%;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer}
#ringBtn:focus-visible{outline-offset:4px}
.stage:has(#ringBtn:active) #r1{filter:brightness(.93)}
.label{position:relative;text-align:center;color:var(--on-c1);pointer-events:none}
#ph{font-family:var(--display);font-size:29px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
#ct{font-family:var(--display);font-size:83px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin-top:2px}
#sub{display:none;font-size:18px;font-weight:600;color:var(--muted);margin-top:6px}
.idle .label{color:var(--fg)}
.idle #ct{display:none}
.idle #sub{display:block}
.idle #r1{background:color-mix(in srgb,var(--c1) 12%,transparent);border:2px solid var(--c1)}
.hint{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:17px;font-weight:600;color:var(--muted);opacity:0;transition:opacity .6s;pointer-events:none}
.hint.show{opacity:1}

/* alsó sor: állapot és a beállítások gomb */
.bottom{width:100%;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px}
.meta{grid-column:2;font-size:18px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;line-height:1.3}
#setBtn{grid-column:1;grid-row:1}
#exitBtn{grid-column:3;grid-row:1;transition:background .2s,color .2s}
#exitBtn.armed{background:#E5352B;color:#fff}       /* első koppintás után: még egy koppintás kilép */
.gear{width:52px;height:52px;border:0;border-radius:50%;background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.gear svg{width:26px;height:26px}

/* Fókusz: gyakorlás közben a körökön kívül minden elhomályosul és elhalványul; koppintásra visszajön */
.modes,.bottom{transition:filter .9s ease,opacity .9s ease}
.app.focus .modes,.app.focus .bottom{filter:blur(8px);opacity:.08;pointer-events:none}
@media (prefers-reduced-motion:reduce){.modes,.bottom{transition:opacity .3s}.app.focus .modes,.app.focus .bottom{filter:none;opacity:.05}}
/* Alvás mód: a képernyő a gyakorlás alatt lassan elsötétül */
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:5}

/* Beállítások: felcsúszó lap, iOS-szerű csoportosított listával */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:10}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);max-height:calc(100% - max(24px,env(safe-area-inset-top,0px)));box-sizing:border-box;display:flex;flex-direction:column;
  background:var(--bg);border-radius:22px 22px 0 0;z-index:11;box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .28s ease-out}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:18px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px))}
.sheet-head h2{flex:1;min-width:0;margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none}
/* almenük: egyszerre egy oldal látszik; a lap mindig teljes magas, így lapozáskor nem ugrál */
.sheet{height:calc(100% - max(24px,env(safe-area-inset-top,0px)))}
.back{flex:none;width:40px;height:40px;margin:0 4px 0 -8px;border:0;border-radius:50%;background:transparent;color:var(--c1);display:grid;place-items:center;cursor:pointer}
.back svg{width:26px;height:26px}
.page{animation:pg .22s ease-out}
@keyframes pg{from{opacity:0;transform:translateX(14px)}}
@media (prefers-reduced-motion:reduce){.page{animation:none}}
.page>.group+.group{margin-top:14px}
.page>.group:first-child{margin-top:8px}
.group>:is(.steps,.note):first-child{padding-top:14px}
.group>textarea:first-child{margin-top:14px}
.navi{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 0;border:0;border-top:1px solid var(--line);background:none;color:var(--fg);font:inherit;font-size:20px;font-weight:700;text-align:left;cursor:pointer}
.navi:first-child{border-top:0}
.navi i{flex:none;width:32px;height:32px;border-radius:9px;background:var(--ic);color:#fff;display:grid;place-items:center}
.navi i svg{width:20px;height:20px}
.navi span{flex:none}
.navi em{flex:1;min-width:0;font-style:normal;font-size:17px;font-weight:600;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navi b{flex:none;font-size:26px;font-weight:600;line-height:1;color:var(--muted);opacity:.7}
a.navi{text-decoration:none;box-sizing:border-box}
/* napló: napi cél, havi naptár */
.gbar{padding:12px 0}
.gbar:empty{display:none}
.gtxt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:17px;font-weight:700;margin-bottom:8px}
.gtxt b{font-variant-numeric:tabular-nums;white-space:nowrap}
.gtxt b.ok{color:var(--c1)}
.gbar i{display:block;height:10px;border-radius:5px;background:color-mix(in srgb,var(--c1) 18%,transparent);overflow:hidden}
.gbar s{display:block;height:100%;border-radius:5px;background:var(--c1);text-decoration:none;transition:width .4s}
.week{position:relative}
.week .gline{position:absolute;left:0;right:0;height:0;border-top:2px dashed color-mix(in srgb,var(--c1) 55%,transparent);pointer-events:none}
.calhead{display:flex;align-items:center;justify-content:space-between;padding:12px 0 6px}
.calhead span{font-size:19px;font-weight:800}
.calhead button{width:38px;height:38px;border:0;border-radius:50%;background:var(--bg);color:var(--fg);font-size:22px;font-weight:700;cursor:pointer}
.calhead button:disabled{opacity:.3;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:4px 0 10px;text-align:center}
.cal b{font-size:13px;font-weight:700;color:var(--muted);padding-bottom:2px}
.cal div{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.cal .part{background:color-mix(in srgb,var(--c1) 28%,transparent);color:var(--fg)}
.cal .full{background:var(--c1);color:var(--on-c1)}
.cal .today{box-shadow:inset 0 0 0 2px var(--fg)}
.cal .future{opacity:.35}
/* súgó és névjegy */
.aboutHead{display:flex;align-items:center;gap:14px;padding:14px 0}
.aboutHead img{border-radius:14px}
.aboutHead b{display:block;font-size:22px;font-weight:800}
.aboutHead span{display:block;font-size:15px;font-weight:600;color:var(--muted);margin-top:2px}
.help{margin:0;padding:12px 0 12px 20px;font-size:17px;font-weight:600;line-height:1.4}
.help li+li{margin-top:8px}
.news{padding:12px 0;border-top:1px solid var(--line)}
.news:first-child{border-top:0}
.news b{display:block;font-size:17px;font-weight:800;margin-bottom:4px}
.news ul{margin:0;padding-left:20px;font-size:16px;font-weight:600;line-height:1.4;color:var(--muted)}
.app.paused #sub{display:block;color:inherit;opacity:.85}
.done{border:0;background:transparent;color:var(--c1);font-size:21px;font-weight:700;padding:8px 4px;cursor:pointer}
.sheet-body{overflow-y:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.sheet-body h3{margin:18px 14px 8px;font-size:16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.group{background:var(--surface);border-radius:16px;padding:0 16px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:6px 0;box-sizing:border-box;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item label,.item>span{font-size:20px;font-weight:700}
.item .desc{display:block;font-size:15px;font-weight:600;color:var(--muted);margin-top:2px;line-height:1.3}
.item output{font-size:20px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.item.slider{padding:2px 0 14px;min-height:0;border-top:0}
.note{font-size:15px;font-weight:600;color:var(--muted);padding:0 0 12px;line-height:1.35}
.opts{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 14px;transition:opacity .2s}
.opts.off{opacity:.45}
.opts button{border:0;background:var(--bg);color:var(--fg);font-size:18px;font-weight:700;padding:10px 15px;border-radius:12px;cursor:pointer}
.opts button small{display:block;font-size:14px;font-weight:600;opacity:.75;font-variant-numeric:tabular-nums;margin-top:1px}
.opts button[aria-pressed="true"]{background:color-mix(in srgb,var(--c1) 18%,var(--surface));color:var(--c1);box-shadow:inset 0 0 0 1.5px var(--c1)}
.opts.rh{padding-top:14px}
.opts.rh button{text-align:left}
/* saját ritmus: négy léptető */
.steps{display:grid;gap:6px;padding:0 0 14px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border-radius:12px;padding:6px 6px 6px 14px}
.stepper span{font-size:19px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepper div{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:36px;height:36px;border:0;border-radius:50%;background:var(--surface);color:var(--fg);font-size:22px;font-weight:700;line-height:1;cursor:pointer}
.stepper output{min-width:26px;text-align:center;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
/* napló: három szám és a hét napjai */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:16px 0 4px;text-align:center}
.kpis b{display:block;font-size:32px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpis span{display:block;font-size:15px;font-weight:600;color:var(--muted);margin-top:2px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;height:140px;box-sizing:border-box;padding:10px 0 14px}
.week div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;min-width:0}
.week i{display:block;width:100%;max-width:26px;min-height:4px;border-radius:5px 5px 2px 2px;background:color-mix(in srgb,var(--c1) 35%,transparent)}
.week .today i{background:var(--c1)}
.week small{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-height:16px}
.week em{font-style:normal;font-size:14px;font-weight:700;color:var(--muted)}
.week .today em{color:var(--fg)}
/* iOS-kapcsoló */
.switch{flex:none;position:relative;width:51px;height:31px;border:0;border-radius:16px;background:color-mix(in srgb,var(--fg) 20%,transparent);cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--c1)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
/* csúszka: vékony sáv, fehér gomb; a kitöltést a --p adja */
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:32px;margin:0;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(to right,var(--c1) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11.5px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.06)}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-progress{height:5px;border-radius:3px;background:var(--c1)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.swatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px 0}
.swatches button{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 4px 12px;border:0;border-radius:14px;background:var(--bg);color:var(--fg);font-size:18px;font-weight:700;cursor:pointer}
.swatches button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--fg)}
.swatches i{width:30px;height:30px;border-radius:50%;background:var(--s1);box-shadow:0 0 0 5px var(--s2)}

/* Telepítési / frissítési sáv: csak nyugalmi állapotban látszik */
.notice{display:none;width:100%;box-sizing:border-box;align-items:center;gap:8px;background:var(--surface);border-radius:16px;padding:8px 6px 8px 16px;font-size:18px;font-weight:600;line-height:1.3;color:var(--muted)}
.notice.show{display:flex}
.app:not(.idle) .notice{display:none}
.notice span{flex:1;min-width:0}
.notice .act{flex:none;border:0;background:color-mix(in srgb,var(--c1) 16%,var(--bg));color:var(--c1);font-size:18px;font-weight:700;padding:10px 14px;border-radius:12px;cursor:pointer}
#nx{flex:none;border:0;background:transparent;color:var(--muted);font-size:26px;font-weight:400;line-height:1;width:40px;height:40px;border-radius:50%;cursor:pointer}

/* Háttérkép: témánként egy táj a téma színeiből. Világosban a közeli rétegek sötétebbek, sötétben (éjszaka) a távoliak világosabbak. */
.app{position:relative;z-index:1}
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;
  --glow:color-mix(in srgb,var(--c2) 38%,var(--bg));--sun:color-mix(in srgb,var(--c2) 70%,var(--surface));
  --l1:color-mix(in srgb,var(--c3) 26%,var(--bg));--l2:color-mix(in srgb,var(--c3) 50%,var(--bg));
  --l3:color-mix(in srgb,var(--c1) 76%,var(--bg));--acc:color-mix(in srgb,var(--c1) 50%,var(--bg))}
@media (prefers-color-scheme:dark){#scene{
  --glow:color-mix(in srgb,var(--c2) 75%,var(--bg));--sun:color-mix(in srgb,var(--fg) 55%,var(--bg));
  --l1:color-mix(in srgb,var(--c2) 60%,var(--bg));--l2:color-mix(in srgb,var(--c2) 32%,var(--bg));
  --l3:color-mix(in srgb,#000 38%,var(--bg));--acc:color-mix(in srgb,var(--c3) 26%,var(--bg))}}
#scene svg{display:block;width:100%;height:100%}
/* Tabata edzés közben: az egész képernyő élénk színű (munka piros, pihenő zöld, felkészülés sárga), óriási számokkal */
body{transition:background-color .35s}
html.tb-run[data-tb="work"]{--tbc:#E5352B;--tbt:#fff}
html.tb-run[data-tb="rest"]{--tbc:#12914A;--tbt:#fff}
html.tb-run[data-tb="prep"]{--tbc:#F5B700;--tbt:#1A1A1A}
html.tb-run body{background:var(--tbc)}
html.tb-run #scene,html.tb-run .ring{visibility:hidden}
html.tb-run .label,html.tb-run .hint,html.tb-run .meta{color:var(--tbt)}
html.tb-run #ph{font-size:clamp(32px,6vh,56px);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
html.tb-run #ct{font-size:min(62vw,40vh);font-weight:800;line-height:.92;letter-spacing:-.04em}
html.tb-run #sub{display:block;color:var(--tbt);font-size:clamp(24px,4.2vh,38px);font-weight:800;font-variant-numeric:tabular-nums;margin-top:6px}
/* Tabata gyorsbeállítás a főképernyőn (csak nyugalmi állapotban, ha a Tabata van kiválasztva) */
.tbpanel{width:100%;display:flex;flex-direction:column;gap:8px}
.app:not(.idle) .tbpanel{display:none}
.tbsteps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tbsteps .stepper{flex-direction:column;align-items:stretch;gap:0;background:var(--surface);padding:5px 6px 6px;border-radius:14px}
.tbsteps .stepper span{font-size:14px;color:var(--muted);text-align:center}
.tbsteps .stepper div{justify-content:space-between}
.tbsteps .stepper button{width:34px;height:34px;font-size:20px;background:var(--bg)}
.tbsteps .stepper output{font-size:22px}
html.tb-run #ringBtn:focus-visible{outline-color:color-mix(in srgb,var(--tbt) 45%,transparent)}
.tbpre{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0}
.tbpre button{background:var(--surface);text-align:center;padding:7px 4px}
.group textarea{display:block;width:100%;box-sizing:border-box;min-height:120px;margin:0 0 10px;border:0;border-radius:12px;background:var(--bg);color:var(--fg);
  font:600 18px/1.4 var(--body);padding:10px 12px;resize:vertical;user-select:text;-webkit-user-select:text}
.group textarea::placeholder{color:var(--muted);opacity:.7}
.item.dim{opacity:.45}
html.tb-run #sub{max-width:92vw;margin-left:auto;margin-right:auto}
html.tb-run #ph{max-width:94vw;margin:0 auto;white-space:nowrap}
.tbvol{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:4px 14px}
.tbvol svg{flex:none;width:24px;height:24px;color:var(--muted)}
.app.scenic .hint{text-shadow:0 0 10px var(--bg),0 0 3px var(--bg)}
.app.scenic .meta{justify-self:center;background:color-mix(in srgb,var(--surface) 80%,transparent);border-radius:14px;padding:6px 14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

@media (max-height:640px){#ph{font-size:24px}#ct{font-size:64px}.modes button{padding:8px 4px;font-size:18px}.modes button small{font-size:14px}}
</style>
<script>/* a választott színtéma már az első kirajzolás előtt */try{var c=JSON.parse(localStorage.getItem('legzo')||'{}').color;if(c&&c!=='erdo')document.documentElement.dataset.color=c}catch(e){}</script>

<body>
<div id="scene" hidden></div>
<div class="app idle" id="app">
  <div class="notice" id="notice" role="status"><span id="ntext"></span><button class="act" id="nact"></button><button id="nx" data-ia="close">×</button></div>

  <div class="modes" id="modes" role="group" data-ia="modes"></div>

  <div class="stage" aria-live="polite">
    <div class="ring" id="r3"></div>
    <div class="ring" id="r2"></div>
    <div class="ring" id="r1"></div>
    <button id="ringBtn"></button>
    <div class="label"><div id="ph"></div><div id="ct"></div><div id="sub"></div></div>
    <div class="hint" id="hint" data-i="hint"></div>
  </div>

  <div class="tbpanel" id="tbPanel" hidden>
    <div class="opts tbpre" id="tbPre" role="group"></div>
    <div class="tbsteps" id="tsteps2"></div>
    <div class="tbvol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <input type="range" id="tvol2" min="0" max="100" step="1" value="80" data-ia="tVol"></div>
  </div>

  <div class="bottom">
    <button class="gear" id="setBtn" data-ia="settings" aria-haspopup="dialog" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/>
        <circle cx="9" cy="7" r="2.6" fill="var(--surface)"/><circle cx="15" cy="17" r="2.6" fill="var(--surface)"/>
      </svg>
    </button>
    <div class="meta" id="meta"></div>
    <button class="gear exit" id="exitBtn" data-ia="exit" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
</div>
<div id="dim"></div>

<div class="backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <header class="sheet-head">
    <button class="back" id="backBtn" data-ia="back" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2 id="sheetTitle" tabindex="-1"></h2><button class="done" id="doneBtn" data-i="ok"></button>
  </header>
  <div class="sheet-body" id="sheetBody">
    <!-- Főoldal: napló és a kategóriák; az almenük alább, egyszerre egy látszik -->
    <div class="page" data-page="main">
      <h3 data-i="journal"></h3>
      <div class="group">
        <div class="kpis" id="kpis"></div>
        <div class="gbar" id="goalMain"></div>
        <button class="navi" data-go="journal"><span data-i="details"></span><em></em><b aria-hidden="true">›</b></button>
      </div>
      <div class="group nav">
        <button class="navi" data-go="rhythms"><i style="--ic:#30A46C"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg></i><span data-i="rhythms"></span><em id="sv_rhythms"></em><b aria-hidden="true">›</b></button>
        <button class="navi" data-go="tabata"><i style="--ic:#E5352B"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13.5" r="7"/><path d="M12 13.5V10M10 3h4M18.5 6.5L17 8"/></svg></i><span data-i="r_tabata"></span><em id="sv_tabata"></em><b aria-hidden="true">›</b></button>
        <button class="navi" data-go="session"><i style="--ic:#5E5CE6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9"/></svg></i><span data-i="session"></span><em id="sv_session"></em><b aria-hidden="true">›</b></button>
      </div>
      <div class="group nav">
        <button class="navi" data-go="sound"><i style="--ic:#FF375F"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></i><span data-i="sound"></span><em id="sv_sound"></em><b aria-hidden="true">›</b></button>
        <button class="navi" data-go="look"><i style="--ic:#FF9F0A"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></i><span data-i="look"></span><em id="sv_look"></em><b aria-hidden="true">›</b></button>
        <button class="navi" data-go="lang"><i style="--ic:#0A84FF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.7 2.6 2.7 13.4 0 16M12 4c-2.7 2.6-2.7 13.4 0 16"/></svg></i><span data-i="language"></span><em id="sv_lang"></em><b aria-hidden="true">›</b></button>
      </div>
      <div class="group nav">
        <button class="navi" data-go="backup"><i style="--ic:#8E8E93"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v10M8 10l4 4 4-4M5 16v3h14v-3"/></svg></i><span data-i="backup"></span><em id="sv_backup"></em><b aria-hidden="true">›</b></button>
        <button class="navi" data-go="about"><i style="--ic:#636366"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 11v5M12 8h.01"/></svg></i><span data-i="about"></span><em id="sv_about"></em><b aria-hidden="true">›</b></button>
      </div>
    </div>

    <div class="page" data-page="journal" hidden>
      <div class="group">
        <div class="gbar" id="goalBar"></div>
        <div class="opts" id="goalOpts" role="group" data-ia="goal"></div>
        <div class="note" id="goalWeek"></div>
      </div>
      <h3 data-i="last7"></h3>
      <div class="group"><div class="week" id="week" role="img"></div></div>
      <h3 data-i="month"></h3>
      <div class="group">
        <div class="calhead"><button id="calPrev" data-ia="prevMonth">‹</button><span id="calTitle"></span><button id="calNext" data-ia="nextMonth">›</button></div>
        <div class="cal" id="cal"></div>
        <div class="note" id="calSum"></div>
      </div>
      <div class="group"><div class="note" id="tabNote"></div></div>
    </div>

    <div class="page" data-page="about" hidden>
      <div class="group"><div class="aboutHead"><img src="icon-192.png" alt="" width="56" height="56"><div><b>RelaxRing</b><span id="verTxt"></span></div></div></div>
      <h3 data-i="howTo"></h3>
      <div class="group"><ul class="help" id="helpList"></ul></div>
      <h3 data-i="whatsNew"></h3>
      <div class="group" id="newsList"></div>
      <h3 data-i="privacy"></h3>
      <div class="group"><div class="note" data-i="privacyTxt"></div></div>
      <div class="group nav">
        <a class="navi" href="https://github.com/vmynick/relaxring" target="_blank" rel="noopener"><span data-i="source"></span><em>GitHub</em><b aria-hidden="true">›</b></a>
        <a class="navi" href="https://github.com/vmynick/relaxring/blob/main/LICENSE" target="_blank" rel="noopener"><span data-i="license"></span><em>MIT</em><b aria-hidden="true">›</b></a>
      </div>
    </div>

    <div class="page" data-page="rhythms" hidden>
      <div class="group">
        <div class="opts rh" id="rhOpts" role="group" data-ia="rhythms"></div>
        <div class="note" data-i="pick3"></div>
        <div class="note" data-i="slowInfo"></div>
        <div class="note" data-i="sighInfo"></div>
      </div>
      <h3 data-i="ownTitle"></h3>
      <div class="group"><div class="steps" id="steps"></div></div>
    </div>

    <div class="page" data-page="tabata" hidden>
      <div class="group"><div class="steps" id="tsteps"></div></div>
      <h3 data-i="tSignal"></h3>
      <div class="group">
        <div class="item"><label for="tvol" data-i="tVol"></label></div>
        <div class="item slider"><input type="range" id="tvol" min="0" max="100" step="1" value="80"></div>
        <div class="note" data-i="tabInfo"></div>
      </div>
      <h3 data-i="exTitle"></h3>
      <div class="group">
        <textarea id="tex" rows="4" data-ph="exPh" data-ia="exTitle"></textarea>
        <div class="note" data-i="exInfo"></div>
      </div>
    </div>

    <div class="page" data-page="session" hidden>
      <div class="group">
        <div class="item"><label for="dur" data-i="duration"></label><output id="durv" for="dur"></output></div>
        <div class="item slider"><input type="range" id="dur" min="1" max="30" step="1" value="5"></div>
        <div class="item"><span><span data-i="sleepMode"></span><small class="desc" data-i="sleepInfo"></small></span><button class="switch" id="sleepSw" role="switch" aria-checked="false" data-ia="sleepMode"></button></div>
        <div class="item" id="fullItem"><span><span data-i="full"></span><small class="desc" data-i="fullInfo"></small></span><button class="switch" id="fullSw" role="switch" aria-checked="true" data-ia="full"></button></div>
        <div class="item"><span data-i="vibration"></span><button class="switch" id="vibSw" role="switch" aria-checked="true" data-ia="vibration"></button></div>
      </div>
    </div>

    <div class="page" data-page="sound" hidden>
      <div class="group">
        <div class="item"><label for="vol" data-i="volume"></label></div>
        <div class="item slider"><input type="range" id="vol" min="0" max="100" step="1" value="35"></div>
      </div>
      <div class="group">
        <div class="item"><span data-i="breath"></span><button class="switch" id="toneSw" role="switch" aria-checked="true" data-ia="breath"></button></div>
        <div class="opts" id="voiceOpts" role="group" data-ia="breathKind"></div>
      </div>
      <div class="group">
        <div class="item"><span data-i="chime"></span><button class="switch" id="bellSw" role="switch" aria-checked="true" data-ia="chime"></button></div>
        <div class="opts" id="chimeOpts" role="group" data-ia="chimeKind"></div>
      </div>
      <div class="group">
        <div class="item"><span data-i="amb"></span></div>
        <div class="opts" id="ambOpts" role="group" data-ia="amb"></div>
        <div class="item slider" id="ambVolRow"><input type="range" id="ambVol" min="0" max="100" step="1" value="50" data-ia="ambVol"></div>
      </div>
      <div class="group">
        <div class="item"><span data-i="speak"></span><button class="switch" id="speakSw" role="switch" aria-checked="false" data-ia="speak"></button></div>
        <div class="note" id="voiceNote" hidden></div>
      </div>
    </div>

    <div class="page" data-page="look" hidden>
      <h3 data-i="theme"></h3>
      <div class="group"><div class="swatches" id="swatches"></div></div>
      <div class="group">
        <div class="item"><span><span data-i="scene"></span><small class="desc" data-i="sceneInfo"></small></span><button class="switch" id="sceneSw" role="switch" aria-checked="false" data-ia="scene"></button></div>
      </div>
    </div>

    <div class="page" data-page="lang" hidden>
      <div class="group"><div class="opts" id="langOpts" role="group" data-ia="language" style="padding-top:14px"></div></div>
    </div>

    <div class="page" data-page="backup" hidden>
      <div class="group">
        <div class="note" data-i="backupInfo"></div>
        <div class="opts"><button id="expBtn" data-i="exportBtn"></button><button id="impBtn" data-i="importBtn"></button></div>
        <input type="file" id="impFile" accept=".json,application/json" hidden>
      </div>
    </div>
  </div>
</section>

// ---------------------------------------------------------------- ritmusok
// Egy ritmus fázisai: [fajta, másodperc]; fajta: in = belégzés, hold = tartás, out = kilégzés
const R={
  box:[['in',4],['hold',4],['out',4],['hold',4]],
  '478':[['in',4],['hold',7],['out',8]],
  calm:[['in',4],['out',6]],
  sigh:[['in',2],['in2',1],['out',6]],   // sóhajtás: két belégzés egymás után, hosszú kilégzés
  coh:[['in',5],['out',5]],          // koherens légzés: percenként 6
  relax:[['in',4],['hold',2],['out',6]],
  slow:null,                         // lassuló: a kilégzés 4-ről 8 mp-re nő a gyakorlás végéig
  own:null,                          // saját: st.own = [be, tartás, ki, tartás]
  tabata:null                        // edzés-időzítő: st.tab = {work, rest, rounds, sets}
};
const RIDS=['box','478','calm','sigh','coh','relax','slow','own','tabata'];   // megjelenítési sorrend (az objektumban a '478' előre kerülne)
function pattern(id){
  if(id==='own'){const [a,b,c,d]=st.own;return [['in',a],['hold',b],['out',c],['hold',d]].filter(x=>x[1]>0)}
  if(id==='slow'){const g=run?Math.min(1,elapsed/(st.dur*60)):0;return [['in',4],['out',Math.round(4+4*g)]]}
  if(id==='tabata')return tabataPlan();
  return R[id];
}
// Tabata: nem ismétlődő kör, hanem a teljes edzés egyben: [fajta, mp, kör, blokk]
function tabataPlan(){
  // 5. elem: a gyakorlat neve (munkánál az aktuális, pihenőnél a következő); pihenő 0 mp-cel = EMOM
  const t=st.tab,ex=exList(),en=k=>ex.length?ex[(k-1)%ex.length]:'',p=t.prep?[['prep',t.prep,0,1,en(1)]]:[];
  for(let s=1;s<=t.sets;s++){
    if(s>1)p.push(['rest',t.brk,0,s,en(1)]);         // blokkok közti pihenő
    for(let k=1;k<=t.rounds;k++){p.push(['work',t.work,k,s,en(k)]);if(k<t.rounds&&t.rest)p.push(['rest',t.rest,k,s,en(k+1)])}
  }
  return p;
}
function exList(){return (st.tab.ex||'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,40)}
function patternLabel(id){
  if(id==='slow')return '4·4→8';
  if(id==='sigh')return '2+1·6';
  if(id==='tabata'){const t=st.tab;return `${t.work}/${t.rest} ×${t.rounds}`+(t.sets>1?` ×${t.sets}`:'')}
  return pattern(id).map(x=>x[1]).join('·');
}

let st={mode:'box',shown:['box','478','calm'],own:[4,4,6,0],vol:35,tone:true,bell:true,vib:true,sleep:false,speak:false,full:true,scene:false,dur:5,

let run=false,i=0,left=0,cyc=0,elapsed=0,tm=null,wake=null,cur=[],curBig=0,exitArmed=false;

// ---------------------------------------------------------------- hang
// Légzőhang: folyamatos, a légzéssel együtt erősödik/halkul. Csengés: rövid jel minden fázis elején.
let ac=null,master=null,tg=null,voice=null,clickBuf=null;
const LO=196,HI=294;
function ensureAudio(){
  if(ac){if(ac.state!=='running')ac.resume();return true}
  try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null;return false}
  master=ac.createGain();master.gain.value=st.vol/100*0.25;master.connect(ac.destination);
  tg=ac.createGain();tg.gain.value=st.tone?1:0;tg.connect(master);
  voice=VOICES[st.voice].make();
  return true;
}
function ramp(p,v,d){const t=ac.currentTime;p.cancelScheduledValues(t);p.setValueAtTime(p.value,t);p.linearRampToValueAtTime(v,t+Math.max(.02,d))}
function brownNoise(){   // 8 mp barna zaj; a végét az elejébe úsztatjuk, így az ismétlődésnél nincs kattanás
  const n=ac.sampleRate*8,f=Math.floor(ac.sampleRate*.5),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);let x=0;
  for(let k=0;k<n+f;k++){x=(x+.02*(Math.random()*2-1))/1.02;if(k<n)d[k]=x*3.5;else{const a=(k-n)/f;d[k-n]=d[k-n]*a+x*3.5*(1-a)}}
  return b;
}
function oscs(defs,dest){return defs.map(([type,f,gain,det])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;o.detune.value=det||0;g.gain.value=gain;o.connect(g);g.connect(dest);o.start();return o})}
const VOICES={
  lagy:{make(){       // szinusz + háromszög, a hangmagasság is követi a légzést
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;lp.connect(tg);
    const g=ac.createGain();g.gain.value=0;g.connect(lp);
    const [o1,o2]=oscs([['sine',LO,1],['triangle',LO*1.5,.25]],g);
    return {inhale(d){ramp(o1.frequency,HI,d);ramp(o2.frequency,HI*1.5,d);ramp(g.gain,.9,d)},
      exhale(d){ramp(o1.frequency,LO,d);ramp(o2.frequency,LO*1.5,d);ramp(g.gain,.15,d)},
      hold(big){ramp(g.gain,big?.45:.08,1)},quiet(d){ramp(g.gain,0,d)},stop(){o1.stop();o2.stop();lp.disconnect()}}}},
  ocean:{make(){      // barna zaj, a szűrő a belégzéssel kinyílik: hullámzás
    const src=ac.createBufferSource();src.buffer=brownNoise();src.loop=true;
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=280;
    const g=ac.createGain();g.gain.value=0;src.connect(lp);lp.connect(g);g.connect(tg);src.start();
    return {inhale(d){ramp(lp.frequency,1700,d);ramp(g.gain,.9,d)},exhale(d){ramp(lp.frequency,260,d);ramp(g.gain,.2,d)},
      hold(big){ramp(g.gain,big?.5:.12,1)},quiet(d){ramp(g.gain,0,d)},stop(){src.stop();g.disconnect()}}}},
  pad:{make(){        // meleg D-akkord, a légzés a szűrőt nyitja-zárja
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;
    const g=ac.createGain();g.gain.value=0;lp.connect(g);g.connect(tg);
    const os=oscs([['triangle',146.83,.5,-6],['triangle',220,.35,6],['triangle',293.66,.3,-5],['sine',440,.12,4]],lp);
    return {inhale(d){ramp(lp.frequency,1500,d);ramp(g.gain,.7,d)},exhale(d){ramp(lp.frequency,360,d);ramp(g.gain,.18,d)},
      hold(big){ramp(g.gain,big?.4:.1,1)},quiet(d){ramp(g.gain,0,d)},stop(){os.forEach(o=>o.stop());g.disconnect()}}}},
  tal:{make(){        // hangtál-zümmögés lassú lebegéssel
    const g=ac.createGain();g.gain.value=0;g.connect(tg);
    const trem=ac.createGain();trem.gain.value=1;trem.connect(g);
    const lfo=ac.createOscillator();lfo.frequency.value=.3;const lg=ac.createGain();lg.gain.value=.25;lfo.connect(lg);lg.connect(trem.gain);lfo.start();
    const [o1,o2]=oscs([['sine',174.6,1],['sine',174.6*2.76,.18]],trem);
    return {inhale(d){ramp(o1.frequency,196,d);ramp(o2.frequency,196*2.76,d);ramp(g.gain,.8,d)},
      exhale(d){ramp(o1.frequency,174.6,d);ramp(o2.frequency,174.6*2.76,d);ramp(g.gain,.2,d)},
      hold(big){ramp(g.gain,big?.45:.1,1)},quiet(d){ramp(g.gain,0,d)},stop(){[o1,o2,lfo].forEach(o=>o.stop());g.disconnect()}}}}
};
function blip(type,f,peak,att,dec,dest=master){
  const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+att+dec);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+att+dec+.05);return o;
}
const CHIMES={
  csengo:{play(f){blip('sine',f,.35,.01,1.8)}},
  tal:{play(f){[[1,.28,4],[2.76,.12,2.5],[5.4,.05,1.2]].forEach(([m,p,d])=>blip('sine',f/2*m,p,.005,d))}},
  fa:{play(f){
    blip('sine',f/2,.45,.002,.12);
    if(!clickBuf){clickBuf=ac.createBuffer(1,ac.sampleRate*.03,ac.sampleRate);const d=clickBuf.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=(Math.random()*2-1)*(1-k/d.length)}
    const n=ac.createBufferSource(),bp=ac.createBiquadFilter(),g=ac.createGain();n.buffer=clickBuf;bp.type='bandpass';bp.frequency.value=1800;bp.Q.value=3;g.gain.value=.5;
    n.connect(bp);bp.connect(g);g.connect(master);n.start()}},
  csepp:{play(f){const o=blip('sine',f*.55,.35,.004,.3),t=ac.currentTime;o.frequency.setValueAtTime(f*.55,t);o.frequency.exponentialRampToValueAtTime(f*1.15,t+.07)}},
  piezo:{play(f){    // mint a Kavics: rövid négyszögjel, halkan
    const hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=450;hp.connect(master);
    const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+.004);g.gain.setValueAtTime(.06,t+.09);g.gain.linearRampToValueAtTime(0,t+.1);
    o.connect(g);g.connect(hp);o.start(t);o.stop(t+.12)}}
};
function ding(f){if(ac&&st.bell)CHIMES[st.chime].play(f)}
function sound(kind,big,d){
  if(!ac||!voice)return;
  if(kind==='in'||kind==='in2'){voice.inhale(d);ding(kind==='in2'?880:784)}
  else if(kind==='out'){voice.exhale(d);ding(587)}
  else{voice.hold(big);ding(659)}
}
function buzz(){if(st.vib)try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}
// Tabata-jelzés: éles négyszögjel külön hangerővel (st.tvol), a légzés halk hangerejétől és a csengéstől függetlenül
let tbGain=null;
function beep(f,len,n=1){
  if(!ac||!st.tvol)return;
  if(!tbGain){tbGain=ac.createGain();const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5000;tbGain.connect(lp);lp.connect(ac.destination)}
  tbGain.gain.value=(st.tvol/100)**2;
  for(let k=0;k<n;k++){
    const t=ac.currentTime+k*(len+.08),o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.005);g.gain.setValueAtTime(.5,t+len-.02);g.gain.linearRampToValueAtTime(0,t+len);
    o.connect(g);g.connect(tbGain);o.start(t);o.stop(t+len+.02);
  }
}
function tbBuzz(p){if(st.vib)try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

// Természethang a légzés alá: a telefon generálja (nincs hangfájl). 8 mp-es hurok, a vége az elejébe úsztatva, így nincs kattanás.
// gen(sr) mintánként ad egy értéket; chain: élő szűrők [fajta, Hz, Q]; lvl: szint a többihez képest.
function loopBuf(secs,next){
  const sr=ac.sampleRate,n=sr*secs,f=Math.floor(sr*.5),b=ac.createBuffer(1,n,sr),d=b.getChannelData(0);
  for(let k=0;k<n+f;k++){const x=next();if(k<n)d[k]=x;else{const a=(k-n)/f;d[k-n]=d[k-n]*a+x*(1-a)}}
  return b;
}
const AMB={
  off:null,
  eso:{lvl:.9,chain:[['highpass',500],['lowpass',7000]],gen:sr=>{let a=0,dec=0;   // sűrű zaj + koppanó cseppek
    return ()=>{const w=Math.random()*2-1;if(Math.random()<45/sr){a=(.25+Math.random()*.75)*(Math.random()<.5?-1:1);dec=Math.exp(-1/(sr*(.002+Math.random()*.004)))}a*=dec;return w*.18+a*w*1.2}}},
  patak:{lvl:1,chain:[['highpass',150],['lowpass',2600]],gen:sr=>{let y=0,ph=0,f=0,env=0,dec=0;   // csobogás + felfelé csúszó buborékok
    return ()=>{const w=Math.random()*2-1;y+=.12*(w-y);
      if(env<.01&&Math.random()<35/sr){f=300+Math.random()*900;env=.25+Math.random()*.35;dec=Math.exp(-1/(sr*(.015+Math.random()*.025)))}
      f*=1+25/sr;ph+=2*Math.PI*f/sr;env*=dec;return y*.9+Math.sin(ph)*env}}},
  tuz:{lvl:.8,chain:[['lowpass',5000]],gen:sr=>{let b=0,a=0,dec=0,burst=0;   // mély zúgás + csoportos pattogás
    return ()=>{const w=Math.random()*2-1;b=(b+.02*w)/1.02;
      if(burst>0)burst--;else if(Math.random()<1.5/sr)burst=sr*(.05+Math.random()*.15);
      if(Math.random()<(burst>0?220:6)/sr){a=(.2+Math.random()*.8)*(Math.random()<.5?-1:1);dec=Math.exp(-1/(sr*(.0004+Math.random()*.0012)))}
      a*=dec;return b*2.2+a*w}}},
  szel:{lvl:1.3,chain:[['bandpass',450,.9]],sweep:true,gen:()=>()=>Math.random()*2-1}   // zaj, lassan vándorló sávszűrővel
};
let amb=null,ambGain=null;
function ambOut(){if(!ambGain){ambGain=ac.createGain();ambGain.connect(master)}ambGain.gain.value=(st.ambVol/100)**1.5*1.2;return ambGain}
function ambStart(fade){
  ambStop(.3);
  const def=AMB[st.amb];if(!def||!ensureAudio())return;
  if(!def.buf)def.buf=loopBuf(8,def.gen(ac.sampleRate));
  const src=ac.createBufferSource(),g=ac.createGain(),osc=[];src.buffer=def.buf;src.loop=true;
  let node=src;
  def.chain.forEach(([type,f,q])=>{const b=ac.createBiquadFilter();b.type=type;b.frequency.value=f;if(q)b.Q.value=q;node.connect(b);node=b;
    if(def.sweep){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=.07;lg.gain.value=300;l.connect(lg);lg.connect(b.frequency);l.start();osc.push(l)}});
  g.gain.value=0;node.connect(g);g.connect(ambOut());src.start();osc.push(src);ramp(g.gain,def.lvl,fade);
  amb={stop(d){ramp(g.gain,0,d);setTimeout(()=>{osc.forEach(o=>{try{o.stop()}catch(e){}});g.disconnect()},d*1000+150)}};
}
function ambStop(d=2){if(amb){amb.stop(d);amb=null}}

// Hangos vezetés: a telefon felolvasóhangja mondja ki a fázist (ha van hang a választott nyelven)
function ttsVoice(){
  if(!('speechSynthesis' in window))return null;
  const vs=speechSynthesis.getVoices();
  return vs.find(v=>v.lang.toLowerCase().replace('_','-')===L.locale.toLowerCase())||vs.find(v=>v.lang.toLowerCase().startsWith(st.lang))||null;
}
function speak(kind){speakText(L[kind])}
function speakText(text){
  if(!st.speak||!('speechSynthesis' in window))return;
  const v=ttsVoice();if(!v)return;
  const u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=.9;u.volume=Math.min(1,.25+st.vol/100);
  speechSynthesis.cancel();setTimeout(()=>speechSynthesis.speak(u),st.bell?250:0);
}
function voiceNote(){
  const n=$('voiceNote');
  const known='speechSynthesis' in window&&speechSynthesis.getVoices().length>0;
  n.textContent=L.noVoice;n.hidden=!(st.speak&&(!('speechSynthesis' in window)||(known&&!ttsVoice())));
}
if('speechSynthesis' in window)speechSynthesis.addEventListener('voiceschanged',voiceNote);

// ---------------------------------------------------------------- napló
// Naponta a gyakorolt másodpercek (kb. 13 hónapra visszamenőleg, a havi naptárhoz), és az alkalmak száma (legalább 1 perc)
function dayKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function logSession(sec){
  if(sec<5)return;
  const k=dayKey(new Date());st.log[k]=(st.log[k]||0)+sec;if(sec>=60)st.sessions++;
  const old=dayKey(addDays(new Date(),-400));for(const d in st.log)if(d<old)delete st.log[d];
  save();
}
function streak(){
  let d=new Date(),n=0;
  if((st.log[dayKey(d)]||0)<60)d=addDays(d,-1);          // ha ma még nem volt, a tegnapig tartó sorozat számít
  while((st.log[dayKey(d)]||0)>=60){n++;d=addDays(d,-1)}
  return n;
}
const GOALS=[2,5,10,15,20,30];                       // napi cél választható értékei (perc)
const todayMin=()=>Math.round((st.log[dayKey(new Date())]||0)/60);
function goalHTML(){const m=todayMin(),g=st.goal,ok=m>=g;
  return `<div class="gtxt"><span>${L.goal}</span><b class="${ok?'ok':''}">${ok?'✓ ':''}${L.goalToday(m,g)}</b></div><i><s style="width:${Math.min(100,m/g*100)}%"></s></i>`}
function renderStats(){                              // a Beállítások főoldala: három szám és a mai cél
  $('kpis').innerHTML=[[streak(),L.streak],[todayMin(),L.today],[st.sessions,L.sessions]].map(([n,t])=>`<div><b>${n}</b><span>${t}</span></div>`).join('');
  $('goalMain').innerHTML=goalHTML();
}
let calOff=0;                                        // a naptárban mutatott hónap: 0 = ez, -1 = előző…
function renderJournal(){
  const today=new Date(),g=st.goal*60,tk=dayKey(today);
  $('goalBar').innerHTML=goalHTML();
  const go=$('goalOpts');go.innerHTML=GOALS.map(n=>`<button data-g="${n}" aria-pressed="${st.goal===n}">${L.min(n)}</button>`).join('');
  go.querySelectorAll('button').forEach(b=>b.onclick=()=>{st.goal=+b.dataset.g;save();renderJournal();renderStats()});
  let n=0;for(let d=addDays(today,-((today.getDay()+6)%7));dayKey(d)<=tk;d=addDays(d,1))if((st.log[dayKey(d)]||0)>=g)n++;
  $('goalWeek').textContent=L.goalWeek(n);
  // az elmúlt 7 nap, a cél szaggatott vonalával
  const days=[...Array(7)].map((_,k)=>addDays(today,k-6)),mins=days.map(d=>Math.round((st.log[dayKey(d)]||0)/60));
  const top=Math.max(10,st.goal,...mins),fmtDay=new Intl.DateTimeFormat(L.locale,{weekday:'narrow'}),wk=$('week');
  wk.innerHTML=days.map((d,k)=>`<div class="${k===6?'today':''}"><small>${mins[k]||''}</small><i style="height:${Math.max(4,mins[k]/top*60)}px"></i><em>${fmtDay.format(d)}</em></div>`).join('')+'<div class="gline"></div>';
  wk.setAttribute('aria-label',L.weekAria(mins.join(', ')));
  const bar=wk.querySelector('i'),line=wk.querySelector('.gline');
  if(wk.offsetHeight)line.style.bottom=wk.getBoundingClientRect().bottom-bar.getBoundingClientRect().bottom+st.goal/top*60+'px';else line.hidden=true;
  // havi naptár: telt = cél teljesült, halvány = legalább 1 perc
  const m0=new Date(today.getFullYear(),today.getMonth()+calOff,1),y=m0.getFullYear(),mo=m0.getMonth(),nd=new Date(y,mo+1,0).getDate();
  $('calTitle').textContent=new Intl.DateTimeFormat(L.locale,{year:'numeric',month:'long'}).format(m0);
  const wd=new Intl.DateTimeFormat(L.locale,{weekday:'narrow'});
  let h=[...Array(7)].map((_,k)=>`<b>${wd.format(new Date(2024,0,1+k))}</b>`).join('')+'<span></span>'.repeat((m0.getDay()+6)%7),act=0,tot=0;
  for(let d=1;d<=nd;d++){const k=dayKey(new Date(y,mo,d)),s=st.log[k]||0;if(s>=60)act++;tot+=s;
    h+=`<div class="${s>=g?'full':s>=60?'part':''}${k===tk?' today':''}${k>tk?' future':''}" aria-label="${d}: ${L.min(Math.round(s/60))}">${d}</div>`}
  $('cal').innerHTML=h;
  $('calSum').textContent=L.monthSum(act,Math.round(tot/60));
  $('calNext').disabled=calOff>=0;$('calPrev').disabled=calOff<=-12;
  $('tabNote').textContent=L.tabN(st.tabN||0);       // a Tabata külön számít, nem légzésperc
}
$('calPrev').onclick=()=>{calOff--;renderJournal()};$('calNext').onclick=()=>{calOff++;renderJournal()};

// Súgó és névjegy: használat, újdonságok, adatvédelem; a verzió mellett a közzététel ideje (a gyorsítótár nevéből)
function renderAbout(){
  $('helpList').innerHTML=L.help.map(x=>`<li>${x}</li>`).join('');
  const df=new Intl.DateTimeFormat(L.locale,{year:'numeric',month:'long',day:'numeric'});
  $('newsList').innerHTML=NEWS.map(n=>`<div class="news"><b>${n.v} · ${df.format(new Date(n.d+'T12:00'))}</b><ul>${(n[st.lang]||n.en).map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('');
  $('verTxt').textContent=`${L.version} ${APP_VER}`;

    if(m)$('verTxt').textContent=`${L.version} ${APP_VER} · ${new Intl.DateTimeFormat(L.locale,{dateStyle:'medium',timeStyle:'short'}).format(new Date(Date.UTC(m[1],m[2]-1,m[3],m[4],m[5])))}`;
  }).catch(()=>{});

// ---------------------------------------------------------------- légzés
function size(big,d){
  const t=reduce?'none':`transform ${d}s ease-in-out`;
  [r1,r2,r3].forEach(e=>e.style.transition=t);
  // big: 0 = kilégzett, 1 = belégzett, 1.2 = a Sóhajtás második, ráadás belégzése
  r1.style.transform=`scale(${1+.6*big})`;
  r2.style.transform=`scale(${1+.3*big})`;
  r3.style.transform=`scale(${.86+.18*big})`;
}
function phase(){
  if(i===0){                                         // minden kör elején (a Lassuló így nyúlik)
    if(!tb&&st.mode!=='tabata')runMode=st.mode;      // légzés közben a Beállításokban váltott ritmus a következő körtől él
    cur=pattern(runMode);
  }
  const [kind,secs]=cur[i];
  ph.textContent=L[kind];left=secs;ct.textContent=left;
  if(tb){                                            // a képernyő színe jelzi a szakaszt (CSS: html[data-tb])
    const exn=cur[i][4];document.documentElement.dataset.tb=kind;ph.style.fontSize=ph.style.whiteSpace='';
    if(kind==='work'&&exn){ph.textContent=exn;fitPh()} // munka közben a gyakorlat neve, pihenőnél alul a következő
    if(!mute){
      if(kind==='work'){beep(1500,.6);tbBuzz(400)}else if(kind==='rest'){beep(750,.3,2);tbBuzz([150,100,150])}
      speakText(kind==='work'&&exn?exn:exn?`${L[kind]}. ${L.next}: ${exn}`:L[kind]);
    }
    mediaMeta();return;
  }
  if(kind==='in')curBig=1;else if(kind==='in2')curBig=1.2;else if(kind==='out')curBig=0;
  if(kind!=='hold')size(curBig,secs);
  if(!mute){sound(kind,curBig,secs);speak(kind);buzz()}
  mediaMeta();
}
function fitPh(){   // hosszú gyakorlatnév: kisebb betű, hogy egy sorba férjen; nagyon hosszúnál inkább tördel
  const w=ph.scrollWidth,max=ph.clientWidth;if(w<=max)return;
  const fs=parseFloat(getComputedStyle(ph).fontSize)*max/w;
  if(fs>=22)ph.style.fontSize=fs+'px';else{ph.style.fontSize='22px';ph.style.whiteSpace='normal'}
}
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,'0')}
function planSecs(p){return p.reduce((a,x)=>a+x[1],0)}
function showMeta(){
  if(exitArmed){meta.textContent=L.exitAgain;return}   // amíg a Kilépés élesítve van, ez a felirat marad
  if(run&&tb){const [kind,,r,s,exn]=cur[i],t=st.tab,x=`${Math.max(1,r)}/${t.rounds}`;   // a kör nagyban a szám alatt, lent a hátralévő idő
    sub.textContent=(t.sets>1?L.tset(s)+' · ':'')+x+(kind!=='work'&&exn?` → ${exn}`:'');
    meta.textContent=(t.sets>1?L.tset(s)+' · '+x:L.tround(x))+' · '+fmt(Math.max(0,planSecs(cur)-elapsed));return}
  if(run){meta.textContent=L.round(cyc,fmt(Math.max(0,st.dur*60-elapsed)));return}
  if(st.mode==='tabata'){meta.textContent=fmt(planSecs(tabataPlan()))+' · '+L.rounds(st.tab.rounds*st.tab.sets);return}
  const v=L['v_'+st.voice],c=L['c_'+st.chime];
  meta.textContent=L.min(st.dur)+' · '+(st.tone&&st.bell?`${v} + ${c}`:st.tone?L.only(v):st.bell?L.only(c):L.silent);
}
// Időzítés a valós órához igazítva: ha a böngésző a háttérben (lezárt képernyőnél) ritkábban hív, a lemaradt
// másodperceket bepótoljuk; nagy lemaradásnál hangok nélkül, hogy ne szóljon egyszerre sok jelzés.
let t0=0,paused=false,pauseAt=0,mute=false;
function tick(){
  if(!run||paused)return;
  const due=Math.floor((performance.now()-t0)/1000);
  mute=due-elapsed>3;
  while(run&&!paused&&elapsed<due){if(due-elapsed===1)mute=false;step()}
  mute=false;
}
function step(){
  elapsed++;left--;
  if(left<=0){
    i++;
    if(i>=cur.length){if(tb){finish();return}i=0;cyc++;if(elapsed>=st.dur*60){finish();return}}
    phase();
  }else{ct.textContent=left;if(tb&&left<=3&&!mute){beep(1000,.15);tbBuzz(60)}}   // Tabata: 3-2-1 csipogás a váltás előtt
  showMeta();
}
// Szünet és folytatás: a lezárási képernyő, a fülhallgató gombja, vagy ha a telefon elveszi a hangot (pl. hívás)
function pause(){
  if(!run||paused)return;
  paused=true;pauseAt=performance.now();
  if(voice)voice.quiet(.5);ambStop(1);if('speechSynthesis' in window)speechSynthesis.cancel();
  if(st.sleep&&!tb)setDim(getComputedStyle(dim).opacity,0);     // az elsötétülés is megáll
  clearTimeout(focusT);app.classList.remove('focus');app.classList.add('paused');
  ph.style.fontSize=ph.style.whiteSpace='';ph.textContent=L.paused;sub.textContent=L.tapResume;ringBtn.setAttribute('aria-label',L.resume);
  if(media&&!media.paused)media.pause();
  mediaMeta();
}
function resume(){
  if(!run||!paused)return;
  paused=false;t0+=performance.now()-pauseAt;ensureAudio();
  app.classList.remove('paused');ringBtn.setAttribute('aria-label',L.stop);
  const [kind,,,,exn]=cur[i];ph.textContent=tb&&kind==='work'&&exn?exn:L[kind];ct.textContent=left;
  if(!tb){                                           // a félbemaradt szakasz a hátralévő időre folytatódik
    if(kind!=='hold')size(curBig,left);
    if(voice){if(kind==='in'||kind==='in2')voice.inhale(left);else if(kind==='out')voice.exhale(left);else voice.hold(curBig)}
    if(st.amb!=='off')ambStart(2);
    if(st.sleep)setDim(.9,Math.max(1,st.dur*60-elapsed));
  }
  if(media&&media.paused)media.play().catch(()=>{});
  showMeta();mediaMeta();focusLater();
}

// Lezárt képernyő: a Web Audio nem vesz részt az Android médiamenetében, ezért mellette egy önálló <audio> elem is szól.
// Így a Chrome médialejátszásnak tekinti: audiofókuszt kér, kikapcsolt képernyőnél is futni hagyja az appot (a Web Audio
// hangjait is), és a lezárási képernyőn vezérlőt mutat (szünet/folytatás, leállítás).
// A Chrome feltételei: a klip 5 mp-nél hosszabb, és a jele a némasági küszöb (−72 dBFS) fölött van. Ezért 20 Hz-es,
// kb. −57 dBFS-es hang: mérhető, de a telefon hangszórója ilyen mély hangot nem szólaltat meg. 60 mp-es hurok, a végein
// negyed másodperces be- és kiúsztatással, hogy az újrakezdésnél se kattanjon.
// Az elemet nem szabad a Web Audióba kötni, és a szintet a mintákban kell megadni (a volume-ot a Chrome is beszámítja).
let media=null,mediaUrl='',metaKey='';
function keepAliveWav(secs){
  const sr=4000,n=sr*secs,f=sr/4,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,s)=>[...s].forEach((c,k)=>v.setUint8(o+k,c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let k=0;k<n;k++)v.setInt16(44+k*2,Math.round(66*Math.min(1,k/f,(n-k)/f)*Math.sin(2*Math.PI*20*k/sr)),true);   // 66/32767 ≈ 0,002 amplitúdó
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}
function mediaStart(){
  if(!media){
    media=new Audio();media.loop=true;mediaUrl=keepAliveWav(60);
    media.addEventListener('pause',()=>{if(run&&!paused)pause()});   // a rendszer állította meg (hívás, másik app)
  }
  metaKey='';mediaMeta();                            // a felirat a lejátszás indulása előtt legyen meg
  media.src=mediaUrl;media.play().catch(()=>{});
}
function mediaStop(){
  if(media){media.pause();media.removeAttribute('src');media.load()}   // a lezárási vezérlő eltűnik
  if('mediaSession' in navigator){navigator.mediaSession.metadata=null;navigator.mediaSession.playbackState='none'}
}
// A felirat csak indításkor, szünetnél és folytatáskor változik: minden módosításnál a Chrome újraküldi a média-értesítést,
// és egyes telefonokon ez minden alkalommal megszólal (szakaszonkénti frissítésnél pár másodpercenként csippant).
function mediaMeta(){
  if(!run||!('mediaSession' in navigator)||!window.MediaMetadata)return;
  const key=runMode+'|'+paused;if(key===metaKey)return;metaKey=key;
  const ms=navigator.mediaSession,dur=tb?planSecs(cur):st.dur*60;
  ms.metadata=new MediaMetadata({title:'RelaxRing – '+L['r_'+runMode],artist:paused?L.paused:tb?fmt(dur):L.min(st.dur),
    artwork:[{src:'icon-192.png',sizes:'192x192',type:'image/png'},{src:'icon-512.png',sizes:'512x512',type:'image/png'}]});
  ms.playbackState=paused?'paused':'playing';
  try{ms.setPositionState({duration:Math.max(dur,elapsed),position:elapsed,playbackRate:1})}catch(e){}
}
if('mediaSession' in navigator){
  const acts={play:()=>resume(),pause:()=>pause(),stop:()=>stop()};
  for(const a in acts)try{navigator.mediaSession.setActionHandler(a,acts[a])}catch(e){}
}

// Háttérkép: 1200×800-as rajz alulra igazítva; a telefon a középső ~370 egységet látja, a horizont a körök alá esik.
// A színek a #scene CSS-változóiból jönnek (--l1 távoli … --l3 közeli réteg), így téma- és világos/sötét váltáskor is illenek.
const sceneEl=$('scene'),sceneSw=$('sceneSw');
function rng(seed){let s=seed;return ()=>(s=s*16807%2147483647)/2147483647}
function wave(y,a,f,ph){const p=[];for(let x=-100;x<=1300;x+=20)p.push([x,y+a*Math.sin(x/f+ph)+a*.45*Math.sin(x/(f*.41)+ph*1.7)]);return p}
function ridge(y,a,step,r){const p=[];for(let x=-100;x<=1300;x+=step)p.push([x,y-r()*a]);return p}
function area(p,fill,extra=''){return `<path d="M${p[0][0]} 800${p.map(q=>`L${q[0]} ${q[1].toFixed(1)}`).join('')}L${p[p.length-1][0]} 800Z" style="fill:var(${fill})" ${extra}/>`}
function trees(p,r,hmin,hmax,fill){   // fenyősor a domb vonalán
  let d='';
  for(const [x,y] of p){if(r()<.2)continue;const h=hmin+r()*(hmax-hmin),w=h*.4,c=x+r()*12-6;
    d+=`M${(c-w/2).toFixed(1)} ${(y+6).toFixed(1)}L${c.toFixed(1)} ${(y-h).toFixed(1)}L${(c+w/2).toFixed(1)} ${(y+6).toFixed(1)}Z`}
  return `<path d="${d}" style="fill:var(${fill})"/>`;
}
const SCENES={
  erdo(){const r=rng(11),a=wave(606,10,150,1),b=wave(652,9,120,2.4),c=wave(708,8,95,4.1);
    return `<circle cx="715" cy="205" r="34" style="fill:var(--sun)"/>`+trees(a,r,30,62,'--l1')+area(a,'--l1')+trees(b,r,40,80,'--l2')+area(b,'--l2')+trees(c,r,50,100,'--l3')+area(c,'--l3')},
  tenger(){let g='';[[92,652],[70,664],[50,677],[32,691]].forEach(([w,y])=>g+=`<rect x="${700-w/2}" y="${y}" width="${w}" height="4" rx="2" style="fill:var(--sun)" opacity=".75"/>`);
    return `<circle cx="700" cy="640" r="58" style="fill:var(--sun)"/><rect x="-100" y="640" width="1400" height="160" style="fill:var(--l1)"/>`+g+area(wave(712,5,55,1),'--l2')+area(wave(756,6,46,2.5),'--l3')},
  levendula(){const field=wave(652,5,220,2);let rows='';
    for(let k=-16;k<=16;k++){const x=600+k*96;rows+=`M600 610L${x-26} 820L${x+26} 820Z`}
    return `<circle cx="500" cy="190" r="32" style="fill:var(--sun)"/>`+area(wave(614,12,170,.5),'--l1')+
      `<clipPath id="fld">${area(field,'--l2')}</clipPath>`+area(field,'--l2')+`<path d="${rows}" style="fill:var(--acc)" clip-path="url(#fld)"/>`},
  naplemente(){const r=rng(5);
    return `<circle cx="680" cy="604" r="80" style="fill:var(--sun)"/>`+area(ridge(616,52,60,r),'--l1')+area(ridge(664,36,46,r),'--l2')+area(wave(718,10,110,3),'--l3')},
  rozsa(){const r=rng(3);let b='';
    for(let k=0;k<16;k++){const x=300+r()*600,y=90+r()*470,s=16+r()*46;b+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${s.toFixed(0)}" fill="url(#bk)" opacity="${(.35+r()*.4).toFixed(2)}"/>`}
    return `<radialGradient id="bk"><stop offset="0" style="stop-color:var(--sun);stop-opacity:.9"/><stop offset="1" style="stop-color:var(--sun);stop-opacity:0"/></radialGradient>`+b+
      area(wave(640,14,210,1),'--l1')+area(wave(690,12,160,2.8),'--l2')+area(wave(746,10,130,4.4),'--l3')},
  ko(){let lines='',rings='';
    for(let y=650;y<800;y+=13)lines+=`M-100 ${y}Q300 ${y-4} 600 ${y}T1300 ${y}`;
    for(let rx=92;rx<=184;rx+=23)rings+=`<ellipse cx="640" cy="728" rx="${rx}" ry="${(rx*.3).toFixed(1)}"/>`;
    return area(wave(604,8,200,1),'--l2')+`<rect x="-100" y="628" width="1400" height="172" style="fill:var(--l1)"/>`+
      `<mask id="mk"><rect x="-100" y="0" width="1400" height="800" fill="#fff"/><ellipse cx="640" cy="728" rx="200" ry="62" fill="#000"/></mask>`+
      `<g style="fill:none;stroke:var(--acc)" stroke-width="1.6" opacity=".55"><path d="${lines}" mask="url(#mk)"/>${rings}</g>`+
      `<g style="fill:var(--l3)"><ellipse cx="640" cy="724" rx="62" ry="19"/><ellipse cx="636" cy="697" rx="46" ry="15"/><ellipse cx="642" cy="675" rx="33" ry="12"/><ellipse cx="639" cy="657" rx="21" ry="9"/>`+
      `<ellipse cx="470" cy="702" rx="34" ry="11"/><ellipse cx="474" cy="687" rx="20" ry="8"/></g>`}
};
function renderScene(){
  sceneEl.hidden=!st.scene;app.classList.toggle('scenic',st.scene);setSwitch(sceneSw,st.scene);
  sceneEl.innerHTML=st.scene?`<svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMax slice" aria-hidden="true">`+
    `<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--bg)"/><stop offset="1" style="stop-color:var(--glow)"/></linearGradient>`+
    `<rect x="-100" y="250" width="1400" height="550" fill="url(#sky)"/>${(SCENES[st.color]||SCENES.erdo)()}</svg>`:'';
}
sceneSw.onclick=()=>{st.scene=!st.scene;save();renderScene()};
function buildSwatches(){
  swatches.innerHTML=THEMES.map(t=>`<button data-t="${t[0]}" aria-pressed="${st.color===t[0]}"><i style="--s1:${t[1]};--s2:${t[2]}"></i>${L['t_'+t[0]]}</button>`).join('');
  swatches.querySelectorAll('button').forEach(b=>b.onclick=()=>applyTheme(b.dataset.t));
}

// Nyelv: minden szöveg a szótárból; a data-i elemek szövegét, a data-ia elemek akadálymentes nevét cseréljük
const langOpts=$('langOpts');
function applyLang(id){
  st.lang=T[id]?id:'hu';L=T[st.lang];save();
  document.documentElement.lang=st.lang;document.title=L.title;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=L[e.dataset.i]);
  document.querySelectorAll('[data-ia]').forEach(e=>e.setAttribute('aria-label',L[e.dataset.ia]));
  opts(voiceOpts,VOICES,'voice',voicePick,id=>L['v_'+id]);
  opts(chimeOpts,CHIMES,'chime',chimePick,id=>L['c_'+id]);
  opts($('ambOpts'),AMB,'amb',ambPick,id=>L['a_'+id]);
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=L[e.dataset.ph]);
  opts(langOpts,T,'lang',applyLang,id=>T[id].name);
  buildSwatches();renderRhythms();renderModes();renderStats();voiceNote();setTitle();navSummary();
  durv.textContent=L.min(st.dur);
  if(run){ph.textContent=L[cur[i][0]];ringBtn.setAttribute('aria-label',L.stop)}else idleLabel();
  if(shownNote)note(...shownNote);
  showMeta();
}

// kezdőállapot
if(!VOICES[st.voice])st.voice='lagy';
if(!AMB.hasOwnProperty(st.amb))st.amb='off';
ambVol.value=st.ambVol;fill(ambVol);$('ambVolRow').classList.toggle('dim',st.amb==='off');tex.value=st.tab.ex;
if(!CHIMES[st.chime])st.chime='csengo';
dur.value=st.dur;vol.value=st.vol;fill(dur);fill(vol);tvols.forEach(x=>{x.value=st.tvol;fill(x)});
applyLang(st.lang);
setSwitch(vibSw,st.vib);setSwitch(sleepSw,st.sleep);setSwitch(speakSw,st.speak);setSwitch(fullSw,st.full);$('fullItem').hidden=!canFull;setTone(st.tone);setBell(st.bell);
applyTheme(st.color);size(0,0);showMeta();

// Gyorsindítás az ikonról (manifest shortcuts): ?r=478 → az a ritmus azonnal indul
{const q=new URLSearchParams(location.search).get('r');
 if(q&&R.hasOwnProperty(q)){st.mode=q;save();mark();history.replaceState(null,'',location.pathname);setTimeout(start,400)}}

// ---------------------------------------------------------------- telepítés, frissítés
const notice=$('notice'),ntext=$('ntext'),nact=$('nact'),nx=$('nx');
function note(textKey,labelKey,act,dismiss){
  shownNote=[textKey,labelKey,act,dismiss];
  ntext.textContent=L[textKey];nact.textContent=L[labelKey];nact.onclick=()=>{shownNote=null;act()};
  nx.onclick=()=>{shownNote=null;notice.classList.remove('show');dismiss&&dismiss()};notice.classList.add('show');
}

// ---------------------------------------------------------------- kilépés
// Csak a telepített appban látszik. Első koppintás élesít (piros gomb, felirat), 3 mp-en belül a második bezárja az appot.
// window.close() akkor engedett, ha az app ablakának nincs előzménye; ha a telefon mégsem engedi, szólunk.
const exitBtn=$('exitBtn');let exitT=0;
exitBtn.hidden=!installed;
function disarm(){exitArmed=false;clearTimeout(exitT);exitBtn.classList.remove('armed');exitBtn.setAttribute('aria-label',L.exit);showMeta()}
exitBtn.onclick=()=>{
  if(!exitArmed){exitArmed=true;exitBtn.classList.add('armed');exitBtn.setAttribute('aria-label',L.exitAgain);showMeta();exitT=setTimeout(disarm,3000);return}
  disarm();if(run)stop();
  window.close();
  setTimeout(()=>note('exitFail','ok',()=>notice.classList.remove('show')),600);
};

// ---------------------------------------------------------------- mentés
// Minden adat (napló, beállítások) csak ezen a telefonon van: fájlba menthető, és máshol vagy újratelepítés után visszatölthető.
// Visszatöltéskor a beállítások felülíródnak, a napló napokra bontva összefésülődik (naponta a nagyobb érték marad).
$('expBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify({app:'relaxring',v:1,date:new Date().toISOString(),st})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`relaxring-${dayKey(new Date())}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);
};
$('impBtn').onclick=()=>$('impFile').click();
$('impFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  let d=null;try{d=JSON.parse(await f.text())}catch(x){}
  if(!d||d.app!=='relaxring'||!d.st||typeof d.st!=='object'){alert(L.importBad);return}
  if(!confirm(L.importAsk))return;
  const log=Object.assign({},d.st.log);for(const k in st.log)log[k]=Math.max(log[k]||0,st.log[k]);
  st=Object.assign({},d.st,{log,sessions:Math.max(st.sessions||0,d.st.sessions||0),tabN:Math.max(st.tabN||0,d.st.tabN||0),
    persistAsked:st.persistAsked,noInstall:st.noInstall});
  save();try{sessionStorage.setItem('imported','1')}catch(x){}
  closeSheet();location.reload();
};
try{if(sessionStorage.getItem('imported')){sessionStorage.removeItem('imported');note('importOk','ok',()=>notice.classList.remove('show'))}}catch(e){}

// Első indításkor a rövid súgót ajánljuk, frissítés után (egyszer) az újdonságokat
function openAbout(news){notice.classList.remove('show');openSheet();openPage('about');if(news)$('newsList').scrollIntoView({block:'start'})}
if(firstRun){st.newsSeen=APP_VER;save();note('welcome','helpBtn',()=>openAbout())}
else if(st.newsSeen!==APP_VER){st.newsSeen=APP_VER;save();note('newsTxt','newsBtn',()=>openAbout(true))}
if(isSecureContext&&'serviceWorker' in navigator){
  // Új verzió: az új service worker átveszi az irányítást (controllerchange) → sáv a Frissítés gombbal.
  // Első telepítéskor nincs előző vezérlő, akkor nem jelzünk.
  const hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(hadCtl)note('newVer','update',()=>location.reload());
  });
  navigator.serviceWorker.register('sw.js').then(reg=>{
    // A telepített app háttérből visszatérve nem tölt újra, ezért ilyenkor és félóránként mi kérdezünk rá
    let last=Date.now();
    const check=()=>{if(document.visibilityState!=='visible'||Date.now()-last<60e3)return;last=Date.now();reg.update().catch(()=>{})};
    document.addEventListener('visibilitychange',check);
    setInterval(check,30*60e3);
  }).catch(()=>{});
}
if(!isSecureContext){
  // Otthoni szerver: ha a telefon már megbízik a RelaxRing tanúsítványában, a https-kérés sikerül → átirányítás
  const ctl=new AbortController();setTimeout(()=>ctl.abort(),3000);
  fetch(`https://${location.hostname}/manifest.json`,{mode:'no-cors',cache:'no-store',signal:ctl.signal})
    .then(()=>location.replace(`https://${location.hostname}${location.pathname}${location.search}`))
    .catch(()=>note('certTxt','certBtn',()=>location.href='setup.html'));
}
let installEv=null;
addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();installEv=e;if(st.noInstall)return;
  note('installTxt','install',async()=>{
    notice.classList.remove('show');installEv.prompt();await installEv.userChoice;installEv=null;
  },()=>{st.noInstall=true;save()});
});
addEventListener('appinstalled',()=>{shownNote=null;notice.classList.remove('show');keepStorage()});

// Tartós tárolás: hogy a telefon helyhiánykor se törölje az app tárolt fájljait és beállításait.
// Telepített appnál a Chrome kérdés nélkül dönt; ahol a böngésző rákérdez (pl. Firefox), csak egyszer kérjük.
async function keepStorage(){
  try{
    if(!navigator.storage||!navigator.storage.persist||await navigator.storage.persisted())return;
    if(st.persistAsked&&!installed)return;
    st.persistAsked=true;save();
    await navigator.storage.persist();
  }catch(e){}
}
if(installed)keepStorage();
</script>
